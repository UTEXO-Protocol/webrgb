name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: Type-check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Declarations plus three ESM files. tsc covers both halves — under a
      # bundler and under NodeNext, which is what resolves the "exports" map —
      # with test/consumer.ts pinning what a dApp can and cannot write; the
      # runtime tests cover what a .d.ts cannot prove.
      - name: Type-check
        run: npm run test:types

      - name: Runtime tests
        run: npm run test:runtime

      # Catches an "exports" map or declaration that resolves wrongly for some
      # consumer — the classic bug in a types-first package.
      - name: Check the packed package (attw + publint)
        run: npm run test:package

      # Prove the published artifact is what the README promises: pack it,
      # install the tarball into a bare project and import it in plain Node.
      - name: Verify package imports (bare Node)
        run: |
          set -euo pipefail
          TGZ="$(npm pack --silent | tail -1)"
          WORK="$(mktemp -d)"
          mv "$TGZ" "$WORK/"
          cd "$WORK"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "./$TGZ"
          node --input-type=module -e "
            const m = await import('@utexo/webrgb');
            if (typeof m.requestProvider !== 'function') throw new Error('requestProvider missing');
            await m.requestProvider().then(
              () => { throw new Error('resolved outside a browser'); },
              (err) => { if (err.code !== 'METHOD_NOT_SUPPORTED') throw err; },
            );
            const { createMockProvider } = await import('@utexo/webrgb/mock');
            const { runConformance } = await import('@utexo/webrgb/conformance');
            const report = await runConformance(createMockProvider());
            if (!report.ok) throw new Error('the mock is not conformant: ' + JSON.stringify(report));
            console.log('OK: every subpath imports in bare Node and refuses politely without a window');
          "
          for f in index.d.ts mock.d.ts conformance.d.ts SPEC.md; do
            test -f "node_modules/@utexo/webrgb/$f"
          done

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high
