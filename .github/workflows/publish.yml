name: Publish to npm

# Publishes @utexo/webrgb to npm.
#   - Automatically on a pushed version tag (e.g. `git tag v0.1.0 && git push --tags`).
#   - Or manually via "Run workflow" (workflow_dispatch).
# Uses the organisation-level NPM_TOKEN secret (an npm automation token with
# publish rights to @utexo). The `npm` environment requires a reviewer to
# approve the run before the token is exposed, so a stray tag cannot publish.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (leave blank to auto: beta for prereleases, latest otherwise)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Never publish an untested build.
      - name: Test
        run: npm test

      # A tag that does not match package.json is a mistake, not a release.
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF#refs/tags/v}"
          [ "$TAG" = "$VERSION" ] || { echo "Tag v$TAG != package.json $VERSION" >&2; exit 64; }

      - name: Resolve dist-tag
        id: disttag
        env:
          INPUT_TAG: ${{ github.event.inputs.dist_tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif printf '%s' "$VERSION" | grep -q '-'; then
            TAG="beta"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with dist-tag '$TAG'"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"
